[package]
name = "vella_nif"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "0.29.0" # Erlang NIF framework
vella = { git = "https://github.com/CharleGutierrez/Vella" }
notify = "6.1.1"
dbase = "0.3.0"
odbc-api = "0.51.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.21.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
