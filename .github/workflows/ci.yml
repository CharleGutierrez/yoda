name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-server:
    name: Test Server (Gleam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.0'
          gleam-version: '1.4.1'
          rebar3-version: '3.22.1'

      - name: Cache Hex & Rebar3
        uses: actions/cache@v4
        with:
          path: |
            ~/.hex
            ~/.cache/rebar3
          key: ${{ runner.os }}-hex-${{ hashFiles('server/gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-hex-

      - name: Run Server Tests
        working-directory: ./server
        run: gleam test

  test-client:
    name: Test Client (Gleam/Lustre)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.0'
          gleam-version: '1.4.1'
          rebar3-version: '3.22.1'

      - name: Run Client Tests
        working-directory: ./client
        run: gleam test

  test-cli:
    name: Test CLI (Gleam/Glint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.0'
          gleam-version: '1.4.1'
          rebar3-version: '3.22.1'

      - name: Run CLI Tests
        working-directory: ./cli
        run: gleam test
